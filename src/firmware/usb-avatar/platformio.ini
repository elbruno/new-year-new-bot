[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
extra_scripts =
    pre:../scripts/firmware/usb-avatar/generate_assets.py
    pre:../scripts/firmware/usb-avatar/patch_stackchan_bsp_motion.py
    post:../scripts/firmware/usb-avatar/python_esptool.py
lib_deps =
    m5stack/M5Unified@0.2.27
    m5stack/M5GFX@0.2.34
    https://github.com/m5stack/StackChan-BSP.git#fb5e9f5697803ca64e45fe7ad8eaea3e4100f766
    IRremoteESP8266@2.9.0
    m5stack/M5Unit-NFC@0.1.2
    m5stack/M5UnitUnified@0.6.3
    m5stack/M5Utility@0.3.1
    m5stack/M5HAL@0.1.4
lib_ignore =
    IRremoteESP8266
monitor_speed = 115200
build_flags = -std=gnu++17

[env:cores3-wifi-lab]
extends = env:cores3
extra_scripts =
    ${env:cores3.extra_scripts}
    pre:../scripts/firmware/usb-avatar/patch_m5unified_speaker.py
    pre:../scripts/firmware/usb-avatar/patch_nfc_bus.py
    pre:../scripts/firmware/usb-avatar/camera_recipe.py
    pre:../scripts/firmware/usb-avatar/unit_motion_record.py
build_flags =
    ${env:cores3.build_flags}
    -DNETBOT_WIFI_LAB
    -DCORE_DEBUG_LEVEL=0
    -Wl,--wrap=_ZN5SCSCL8WritePosEhttt

[env:cores3-lesson-examples]
extends = env:cores3-wifi-lab
build_flags =
    ${env:cores3-wifi-lab.build_flags}
    -DNETBOT_LESSON_EXAMPLES

[env:cores3-wifi-manual-diagnostic]
extends = env:cores3-wifi-lab
build_flags =
    ${env:cores3-wifi-lab.build_flags}
    -DNETBOT_MANUAL_AXIS_DIAGNOSTIC
