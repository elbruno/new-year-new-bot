[platformio]
src_dir = .
build_dir = ../../../.cache/official-bsp-motion-smoke/build

[env:cores3]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
board_build.partitions = partitions.csv
board_upload.offset_address = 0x20000
board_upload.maximum_size = 5177344
extra_scripts =
    post:../../../scripts/firmware/usb-avatar/python_esptool.py
    post:../../../scripts/firmware/usb-avatar/examples/OfficialBspMotionSmoke/upload_layout.py
lib_extra_dirs = ../../.pio/libdeps/cores3
lib_ignore = IRremoteESP8266
build_flags = -std=gnu++17
